<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI와 로봇 연구하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #ffffff; --bg-alt: #f5f5f7; --bg-sidebar: #f5f5f7; --bg-code: #f5f5f7; --bg-surface: #f5f5f7; --text: #1d1d1f; --text-body: rgba(0, 0, 0, 0.80); --text-muted: rgba(0, 0, 0, 0.56); --text-heading: #1d1d1f; --accent: #0071e3; --link: #0066cc; --border: rgba(0, 0, 0, 0.08); --border-strong: rgba(0, 0, 0, 0.16); --sidebar-width: 300px; --topbar-height: 52px; --progress-height: 3px; --shadow-elev: rgba(0, 0, 0, 0.22) 3px 5px 30px 0px; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; font-size: 17px; line-height: 1.47; letter-spacing: 0; color: var(--text); background: var(--bg); overflow-x: hidden; font-feature-settings: "kern", "liga", "calt"; word-break: keep-all; overflow-wrap: break-word; }
#progress-bar { position: fixed; top: 0; left: 0; height: var(--progress-height); background: linear-gradient(90deg, #0071e3, #2997ff); z-index: 10000; transition: width 0.1s linear; width: 0%; }
#topbar { position: fixed; top: var(--progress-height); left: 0; right: 0; height: var(--topbar-height); background: rgba(255, 255, 255, 0.72); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; z-index: 1000; }
#topbar .menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; margin-right: 12px; padding: 6px 10px; border-radius: 8px; }
#topbar .menu-toggle:hover { background: rgba(0,0,0,0.04); }
#topbar .title { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; font-size: 17px; font-weight: 600; color: var(--text-heading); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topbar .back-link { margin-left: auto; color: var(--link); text-decoration: none; font-size: 13.5px; font-weight: 500; white-space: nowrap; padding: 7px 14px; border-radius: 980px; border: 1px solid var(--border); letter-spacing: 0; transition: background 0.15s, border-color 0.15s, color 0.15s; }
#topbar .back-link:hover { background: rgba(0, 113, 227, 0.06); border-color: var(--accent); color: var(--accent); }
#sidebar { position: fixed; top: calc(var(--progress-height) + var(--topbar-height)); left: 0; width: var(--sidebar-width); height: calc(100vh - var(--topbar-height) - var(--progress-height)); background: var(--bg-sidebar); border-right: 1px solid var(--border); overflow-y: auto; z-index: 999; display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.16) transparent; }
#sidebar::-webkit-scrollbar { width: 6px; } #sidebar::-webkit-scrollbar-track { background: transparent; } #sidebar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.16); border-radius: 3px; }
#search-box { padding: 14px 16px; border-bottom: 1px solid var(--border); background: rgba(255, 255, 255, 0.6); flex-shrink: 0; }
#search-input { width: 100%; padding: 9px 12px; background: #ffffff; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13.5px; outline: none; font-family: inherit; letter-spacing: 0; transition: border-color 0.15s, box-shadow 0.15s; }
#search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); } #search-input::placeholder { color: var(--text-muted); }
#toc-container { flex: 1; overflow-y: auto; padding: 8px 0 32px; } #toc-container::-webkit-scrollbar { width: 4px; } #toc-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }
.toc-item { display: block; padding: 8px 16px 8px 20px; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; line-height: 1.4; letter-spacing: 0; border-left: 3px solid transparent; transition: color 0.15s, background 0.15s, border-color 0.15s; cursor: pointer; }
.toc-item.toc-h2 { padding: 5px 16px 5px 36px; font-size: 13px; font-weight: 400; color: var(--text-muted); }
.toc-item:hover { color: var(--text); background: rgba(0, 0, 0, 0.04); } .toc-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(0, 113, 227, 0.08); font-weight: 600; } .toc-item.toc-h2.active { font-weight: 500; color: var(--accent); } .toc-item.toc-hidden { display: none; }
.toc-no-results { padding: 20px 16px; color: var(--text-muted); font-size: 13.5px; text-align: center; display: none; }
#main-content { margin-left: var(--sidebar-width); margin-top: calc(var(--progress-height) + var(--topbar-height)); min-height: calc(100vh - var(--topbar-height) - var(--progress-height)); padding: 56px 56px 96px; }
#content { max-width: 820px; margin: 0 auto; }
#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif; color: var(--text-heading); font-feature-settings: "kern"; scroll-margin-top: 72px; letter-spacing: 0; }
#content h1 { font-size: 48px; font-weight: 600; line-height: 1.08; margin: 0 0 28px 0; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
#content h2 { font-size: 34px; font-weight: 600; line-height: 1.10; margin: 64px 0 20px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
#content h3 { font-size: 24px; font-weight: 600; line-height: 1.16; margin: 44px 0 14px 0; }
#content h4 { font-size: 19px; font-weight: 600; line-height: 1.22; margin: 32px 0 10px 0; }
#content p { margin: 0 0 16px 0; color: var(--text-body); } #content a { color: var(--link); text-decoration: none; transition: color 0.15s; } #content a:hover { text-decoration: underline; text-underline-offset: 2px; }
#content ul, #content ol { margin: 0 0 16px 0; padding-left: 28px; } #content li { margin-bottom: 6px; color: var(--text-body); } #content hr { border: none; border-top: 1px solid var(--border); margin: 56px 0; } #content strong { color: var(--text); font-weight: 600; }
#content code { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 0.82em; letter-spacing: 0; }
#content :not(pre) > code { background: var(--bg-code); padding: 2px 6px; border-radius: 5px; color: var(--text); } #content pre { background: var(--bg-code); border: none; border-radius: 12px; padding: 18px 20px; overflow-x: auto; margin: 0 0 20px 0; font-size: 13px; line-height: 1.55; } #content pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
#content table { width: 100%; border-collapse: collapse; margin: 0 0 20px 0; font-size: 15px; display: block; overflow-x: auto; } #content thead { background: var(--bg-surface); } #content th { padding: 12px 16px; text-align: left; color: var(--text-heading); font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--border-strong); letter-spacing: 0; } #content td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-body); letter-spacing: 0; } #content tbody tr:hover { background: rgba(0,113,227,0.04); }
#content blockquote { border-left: 3px solid var(--accent); background: var(--bg-surface); padding: 14px 22px; margin: 0 0 20px 0; border-radius: 0 8px 8px 0; color: var(--text-body); } #content blockquote p { margin-bottom: 8px; } #content blockquote p:last-child { margin-bottom: 0; }
.guide-overview { margin: 0 0 80px 0; padding: 0 0 48px 0; border-bottom: 1px solid var(--border); } .guide-overview .overview-header { margin-bottom: 44px; }
.guide-overview .overview-title { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif; font-size: 48px; font-weight: 600; line-height: 1.08; color: var(--text-heading); margin: 0 0 10px 0; letter-spacing: 0; }
.overview-group-label { font-size: 11px; font-weight: 700; color: rgba(0, 0, 0, 0.42); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 18px 0; }
.overview-chapter { margin: 0 0 22px 0; } .overview-chapter-link { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif; font-size: 19px; font-weight: 600; color: var(--text-heading); text-decoration: none; display: inline-block; } .overview-chapter-link:hover { color: var(--accent); }
.overview-chapter-num { font-size: 12px; font-weight: 700; color: var(--accent); margin-right: 10px; text-transform: uppercase; } .overview-sections { margin-top: 4px; font-size: 14px; line-height: 1.55; color: var(--text-muted); } .overview-sections a { color: var(--text-muted); text-decoration: none; } .overview-sections a:hover { color: var(--accent); } .overview-sections .sep { margin: 0 8px; color: var(--border-strong); }
::selection { background: rgba(0,113,227,0.20); color: var(--text); }
@media (max-width: 1024px) { #main-content { padding-left: 40px; padding-right: 40px; } }
@media (max-width: 900px) { #topbar .menu-toggle { display: block; } #sidebar { transform: translateX(-100%); transition: transform 0.3s ease; box-shadow: none; } #sidebar.open { transform: translateX(0); box-shadow: var(--shadow-elev); } #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 998; } #sidebar-overlay.visible { display: block; } #main-content { margin-left: 0; padding: 24px 24px 56px; } #content h1, .guide-overview .overview-title { font-size: 36px; } #content h2 { font-size: 28px; margin-top: 48px; } #content h3 { font-size: 21px; } }
@media (max-width: 600px) { body { font-size: 16px; } #content h1, .guide-overview .overview-title { font-size: 30px; } #content h2 { font-size: 24px; } #content h3 { font-size: 19px; } #main-content { padding: 20px 20px 48px; } }
@media print { #progress-bar, #topbar, #sidebar, #sidebar-overlay, #search-box, .menu-toggle { display: none !important; } #main-content { margin: 0 !important; padding: 0 !important; } #content { max-width: 100%; color: #000; } body { background: #fff; } }
</style>
</head>
<body>
<div id="progress-bar"></div>
<div id="topbar"><button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">&#9776;</button><span class="title">AI와 로봇 연구하기</span><a href="../" class="back-link">← repos</a></div>
<div id="sidebar-overlay"></div>
<nav id="sidebar"><div id="search-box"><input type="text" id="search-input" placeholder="Search headings... (Ctrl+K)"></div><div id="toc-container"></div><div class="toc-no-results" id="toc-no-results">No matching sections</div></nav>
<main id="main-content"><div id="content">{{CONTENT}}</div></main>
<script>
(function() {
  var tocContainer = document.getElementById('toc-container'); var contentEl = document.getElementById('content');
  function slugify(text) { return text.toLowerCase().trim().replace(/<[^>]+>/g, '').replace(/[^\w\s가-힣-]/g, '').replace(/\s+/g, '-').substring(0, 80) || 'section'; }
  function buildTOC() { var headings = contentEl.querySelectorAll('h1, h2'); var fragment = document.createDocumentFragment(); headings.forEach(function(heading) { if (heading.classList.contains('overview-title')) return; if (!heading.id) heading.id = slugify(heading.textContent); var link = document.createElement('a'); link.className = 'toc-item ' + (heading.tagName === 'H2' ? 'toc-h2' : 'toc-h1'); link.href = '#' + heading.id; link.dataset.headingId = heading.id; link.textContent = heading.textContent; fragment.appendChild(link); }); tocContainer.appendChild(fragment); }
  function setupScrollTracking() { var headings = contentEl.querySelectorAll('h1, h2'); var ticking = false; function updateActive() { var found = null; var y = window.scrollY + 80; for (var i = headings.length - 1; i >= 0; i--) { if (headings[i].offsetTop <= y) { found = headings[i]; break; } } var active = tocContainer.querySelector('.toc-item.active'); if (active) active.classList.remove('active'); if (found) { var item = tocContainer.querySelector('[data-heading-id="' + CSS.escape(found.id) + '"]'); if (item) item.classList.add('active'); } } window.addEventListener('scroll', function() { if (!ticking) requestAnimationFrame(function() { updateActive(); ticking = false; }); ticking = true; }); updateActive(); }
  function setupSearch() { var input = document.getElementById('search-input'); var noResults = document.getElementById('toc-no-results'); input.addEventListener('input', function() { var query = this.value.trim().toLowerCase(); var items = tocContainer.querySelectorAll('.toc-item'); var matchCount = 0; items.forEach(function(item) { var matched = !query || item.textContent.toLowerCase().indexOf(query) !== -1; item.classList.toggle('toc-hidden', !matched); if (matched) matchCount++; }); noResults.style.display = matchCount === 0 ? 'block' : 'none'; }); }
  function setupProgressBar() { var bar = document.getElementById('progress-bar'); function update() { var max = document.documentElement.scrollHeight - window.innerHeight; var p = max > 0 ? window.scrollY / max * 100 : 0; bar.style.width = Math.min(100, p) + '%'; } window.addEventListener('scroll', update); update(); }
  function setupMobileMenu() { var toggle = document.getElementById('menu-toggle'); var sidebar = document.getElementById('sidebar'); var overlay = document.getElementById('sidebar-overlay'); function close() { sidebar.classList.remove('open'); overlay.classList.remove('visible'); } toggle.addEventListener('click', function() { sidebar.classList.toggle('open'); overlay.classList.toggle('visible'); }); overlay.addEventListener('click', close); tocContainer.addEventListener('click', close); }
  function setupKeyboard() { document.addEventListener('keydown', function(e) { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('search-input').focus(); } }); }
  buildTOC(); setupScrollTracking(); setupSearch(); setupProgressBar(); setupMobileMenu(); setupKeyboard();
})();
</script>

</body>
</html>
